[package]
name = "deck"
version = "0.1.0"
description = "Local-first personal agent swarm (codename)"
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
fs2 = "0.4"

[profile.release]
codegen-units = 1
lto = true
strip = true
